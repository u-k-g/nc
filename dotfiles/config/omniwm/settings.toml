# Managed by nc. OmniWM recovers unspecified settings from built-in defaults.

[general]
defaultLayoutType = "niri"
hotkeysEnabled = true
ipcEnabled = true
animationsEnabled = false
updateChecksEnabled = false

[focus]
followsMouse = false
moveMouseToFocusedWindow = true
followsWindowToMonitor = false

[gaps]
size = 4.0

[gaps.outer]
left = 8.0
right = 8.0
top = 4.0
bottom = 4.0

[niri]
maxWindowsPerColumn = 10
maxVisibleColumns = 1
infiniteLoop = false
centerFocusedColumn = "onOverflow"
alwaysCenterSingleColumn = false
singleWindowAspectRatio = "none"
columnWidthPresets = [0.3333333333333333, 0.5, 0.6666666666666666, 0.75, 1.0]
defaultColumnWidth = 1.0

[borders]
enabled = false
width = 0.0

[borders.color]
red = 0.0
green = 0.0
blue = 0.0
alpha = 0.0

[workspaceBar]
enabled = false
showLabels = true
showFloatingWindows = false
windowLevel = "popup"
position = "overlappingMenuBar"
notchAware = true
deduplicateAppIcons = true
hideEmptyWorkspaces = false
reserveLayoutSpace = false
height = 24.0
backgroundOpacity = 0.1
xOffset = 0.0
yOffset = 0.0
labelFontSize = 12.0

[statusBar]
showWorkspaceName = false
showAppNames = false
useWorkspaceId = false

[quakeTerminal]
enabled = true

[gestures]
scrollEnabled = true
scrollSensitivity = 5.0
scrollModifierKey = "optionShift"
mouseResizeModifierKey = "option"
fingerCount = 3
invertDirection = true

