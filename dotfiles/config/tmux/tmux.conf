# =============================================================================
# GENERAL SETTINGS
# =============================================================================

set -g prefix C-space
set -g allow-rename on
set-window-option -g automatic-rename on
set-window-option -g automatic-rename-format '#{?#{==:#{pane_current_command},nu},#{b:pane_current_path},#{pane_current_command}}'
set -g bell-action none

## styling
set -g pane-active-border-style 'fg=#{@theme_accent}'
set -g pane-border-style 'fg=#{@theme_fg_muted}'
setw -g mode-style 'fg=#{@theme_fg_dim} bg=#{@theme_bg_light}'
set -g message-style 'fg=#{@theme_warning},bg=default,bold'

## sensible defaults
set -g history-limit 50000
set -s escape-time 0
set -g display-time 4000
set -g status-interval 15
set -g status-keys vi
set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g renumber-windows on
set -g set-clipboard on
set -g base-index 1
setw -g mode-keys vi
setw -g pane-base-index 1
set -g allow-passthrough on
set -g mouse on
set -g repeat-time 1

# =============================================================================
# DISPLAY & TERMINAL
# =============================================================================

set -g default-terminal 'tmux-256color'
set -a terminal-features "tmux-256color:RGB"
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'


# =============================================================================
# STATUS BAR
# =============================================================================

set -g status-position top
set -g status-justify left
set -g status-style 'fg=#{@theme_accent}'
set -g status-right-length 100
set -g status-left '#[fg=#{@theme_accent_alt},bold] -'
set -g status-right '#{?client_prefix,#[fg=#{@theme_accent_alt}]pfx,#[fg=#{@theme_fg_muted}]···}'
set -ag status-right '#{?window_zoomed_flag,#[fg=#{@theme_accent_alt}]+,#[fg=#{@theme_fg_muted}]·}'

# set -ag status-right ' #[fg=#{@theme_accent}][#[italics]#S #[fg=#{@theme_fg_muted}]as #[fg=#{@theme_accent}]#{client_user} #[fg=#{@theme_fg_muted}]on #[fg=#{@theme_accent}]#h]'
# set -ag status-right ' #[fg=#{@theme_accent}][#[italics]#S #[fg=#{@theme_fg_muted}]‹ #[fg=#{@theme_accent}]#{client_user}#[fg=#{@theme_fg_muted}]@#[fg=#{@theme_accent}]#h]'
set -ag status-right ' #[fg=#{@theme_accent}][#{client_user}#[fg=#{@theme_fg_muted}]@#[fg=#{@theme_accent}]#h #[fg=#{@theme_fg_muted}]› #[fg=#{@theme_accent},italics]#S#[noitalics]#[fg=#{@theme_accent}]]'

set -ag status-right '#[fg=#{@theme_accent_alt},bold] - '

setw -g window-status-current-style 'fg=#{@theme_accent} bold'
setw -g window-status-current-format ' #I #W'
setw -g window-status-style 'fg=#{@theme_fg_dim}'
setw -g window-status-format ' #[fg=#{@theme_fg_muted}]#I #[fg=#{@theme_fg_muted}]#W'

# =============================================================================
# KEYBINDINGS
# =============================================================================

## unbinds
unbind [
unbind ]
unbind p
unbind n
unbind o
unbind "'"
unbind '"'
unbind %
unbind .
unbind r
unbind ' '
unbind '#'
unbind 'm'
unbind 'M'
unbind '('
unbind ')'
unbind 'C'
unbind 'i'
unbind '~'
unbind 'D'
unbind 'M-n'
unbind 'M-p'
unbind ';'
unbind q
unbind &
unbind f
unbind w

## misc
bind r source-file ~/.config/tmux/tmux.conf \; display-message "reloaded."
bind-key , new-window hx ~/.config/tmux/tmux.conf
bind-key -n M-BSpace send-keys C-w

## window
bind R command-prompt "rename-window %%"

## window/pane creation
bind c new-window -c "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"
bind \\ split-window -hc "#{pane_current_path}"

## window reordering
bind-key -n C-S-h swap-window -t -1\; select-window -t -1
bind-key -n C-S-l swap-window -t +1\; select-window -t +1

## navigation
bind k select-pane -U
bind j select-pane -D
bind -n C-k select-pane -U
bind -n C-j select-pane -D
bind h if -F "#{pane_at_left}" "select-window -t -1" "select-pane -L"
bind l if -F "#{pane_at_right}" "select-window -t +1" "select-pane -R"
bind -n C-h if -F "#{pane_at_left}" "select-window -t -1" "select-pane -L"
bind -n C-l if -F "#{pane_at_right}" "select-window -t +1" "select-pane -R"

bind s display-popup -E -w 40% -h 40% -S 'fg=#{@theme_bg_light}' -b rounded \
    "tmux list-sessions -F '#S' | fzf --reverse --border=none --margin=1 --padding=1 \
    --prompt='  ' --pointer='▌' --no-scrollbar \
    --color=bg:#{@theme_bg},bg+:#{@theme_bg_highlight},fg:#{@theme_fg},fg+:#{@theme_fg},hl:#{@theme_accent},hl+:#{@theme_accent},pointer:#{@theme_warning},prompt:#{@theme_success},info:#{@theme_info},border:#{@theme_fg_muted} \
    | xargs -I{} tmux switch-client -t {}"

bind f display-popup -E -w 50% -h 50% -S "fg=#{@theme_bg_light}" -b rounded "~/.config/tmux/scripts/sessionizer"

bind Q display-popup -E -w 40% -h 40% -S 'fg=#{@theme_bg_light}' -b rounded \
    "tmux list-sessions -F '#S' | fzf --reverse --border=none --margin=1 --padding=1 \
    --prompt='kill:  ' --pointer='▌' --no-scrollbar \
    --color=bg:#{@theme_bg},bg+:#{@theme_bg_highlight},fg:#{@theme_fg},fg+:#{@theme_error},hl:#{@theme_accent},hl+:#{@theme_accent},pointer:#{@theme_error},prompt:#{@theme_error},info:#{@theme_fg_muted} \
    | xargs -I{} tmux kill-session -t {}"


# =============================================================================
# COPY MODE & CLIPBOARD
# =============================================================================

bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

if-shell "command -v pbcopy" {
    bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key P run "pbpaste | tmux loadb - ; tmux pasteb -p"
}

# scrolling
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down


set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
